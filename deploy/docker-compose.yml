# The way an installation is run. Upgrading is `docker compose pull` followed by
# `docker compose up`: migrations apply themselves on startup, and there is no
# separate step and no sequence to follow between versions.
#
# Set POSTGRES_PASSWORD in a .env file beside this one before the first start.

name: logaffe

services:
  logaffe:
    image: ghcr.io/datavisionzero/logaffe:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: >-
        Host=db;Port=5432;Database=logaffe;Username=logaffe;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # How the claim is guarded until somebody makes it (docs/setup.md).
      # `secret` is the default: nobody can claim the installation without the
      # claim secret, and there is no deadline. Leave LOGAFFE_CLAIM_SECRET unset
      # and the installation draws one on its first start, writes it to
      # /var/lib/logaffe/claim-secret.txt on the volume and logs it once.
      # `window` is the other way: no secret, and anyone who reaches the
      # installation may claim it for 30 minutes after its first run. It is for
      # the host where reading that file or that log is not on offer.
      Logaffe__Claim__Mode: "${LOGAFFE_CLAIM_MODE:-secret}"
      Logaffe__Claim__Secret: "${LOGAFFE_CLAIM_SECRET:-}"
      # An installation reached through a reverse proxy names it here, as
      # addresses or CIDR ranges, so that the address a request is throttled by
      # and listed under is the caller's rather than the proxy's. Unset means
      # nothing is trusted and `X-Forwarded-For` is ignored, which is right for
      # an installation reached directly: the header is written by whoever sent
      # the request.
      Logaffe__TrustedProxies: "${LOGAFFE_TRUSTED_PROXIES:-}"
      # The address this installation is reached at, used for one thing only:
      # the link an alert carries (docs/alerts.md). Everywhere else the address
      # comes free from the forwarded headers, because everywhere else there is
      # a request to read them from — an alert is composed on the hour with
      # nobody on the other end. Unset means an alert goes without a link
      # rather than with a wrong one.
      Logaffe__PublicUrl: "${LOGAFFE_PUBLIC_URL:-}"
    volumes:
      # Both stores are needed, and a database alone is not a backup: the key
      # that makes stored tokens readable lives here.
      - logaffe-volume:/var/lib/logaffe
    ports:
      - "8080:8080"
    healthcheck:
      # Answers 200 or 503 and nothing else; it reports ready when the database
      # is reachable and migrations are complete.
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: logaffe
      POSTGRES_USER: logaffe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - logaffe-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logaffe -d logaffe"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  logaffe-volume:
  logaffe-db:
