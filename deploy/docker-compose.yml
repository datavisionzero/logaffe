# The way an installation is run. Upgrading is `docker compose pull` followed by
# `docker compose up`: migrations apply themselves on startup, and there is no
# separate step and no sequence to follow between versions.
#
# Set POSTGRES_PASSWORD and the three LOGAFFE_BOOTSTRAP_* values in a .env file
# beside this one before the first start. The first start is the only one that
# reads them.

name: logaffe

services:
  logaffe:
    image: ghcr.io/datavisionzero/logaffe:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: >-
        Host=db;Port=5432;Database=logaffe;Username=logaffe;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # The first administrator, created on the one start where this
      # installation holds no identity (docs/setup.md). The token is exchanged
      # once in the browser for a password — a password here would be a password
      # in your shell history and in `docker inspect` — and it has to be at
      # least 32 characters, so draw it rather than think of it:
      #
      #   openssl rand -base64 32
      #
      # From the second start these three are ignored, whatever they say.
      Logaffe__Bootstrap__Administrator: "${LOGAFFE_BOOTSTRAP_ADMIN:-}"
      Logaffe__Bootstrap__Email: "${LOGAFFE_BOOTSTRAP_EMAIL:-}"
      Logaffe__Bootstrap__Token: "${LOGAFFE_BOOTSTRAP_TOKEN:-}"
      # An installation reached through a reverse proxy names it here, as
      # addresses or CIDR ranges, so that the address a request is throttled by
      # and listed under is the caller's rather than the proxy's. Unset means
      # nothing is trusted and `X-Forwarded-For` is ignored, which is right for
      # an installation reached directly: the header is written by whoever sent
      # the request.
      Logaffe__TrustedProxies: "${LOGAFFE_TRUSTED_PROXIES:-}"
      # The address this installation is reached at. It is used for the two
      # things composed with nobody on the other end of a request: the link an
      # alert carries (docs/alerts.md) and every link in a message this
      # installation sends (docs/setup.md). Never taken from an incoming Host
      # header — that is a link an attacker would choose. Unset means an alert
      # goes without a link rather than with a wrong one, and mail cannot be
      # configured at all.
      Logaffe__PublicUrl: "${LOGAFFE_PUBLIC_URL:-}"
      # Transactional mail: invitations, password recovery and address changes,
      # and nothing else (docs/setup.md). It is optional — an installation
      # without it is healthy, and only those three acts refuse — and it is
      # configuration rather than a second container: there is no queue and
      # nothing retries.
      #
      # `starttls` is the default and is what port 587 means; `tls` is port 465.
      # Leave the username and password unset for a relay that takes mail from
      # its own network without authenticating.
      Logaffe__Smtp__Host: "${LOGAFFE_SMTP_HOST:-}"
      Logaffe__Smtp__Port: "${LOGAFFE_SMTP_PORT:-}"
      Logaffe__Smtp__Security: "${LOGAFFE_SMTP_SECURITY:-}"
      Logaffe__Smtp__Username: "${LOGAFFE_SMTP_USERNAME:-}"
      Logaffe__Smtp__Password: "${LOGAFFE_SMTP_PASSWORD:-}"
      Logaffe__Smtp__From: "${LOGAFFE_SMTP_FROM:-}"
      Logaffe__Smtp__FromName: "${LOGAFFE_SMTP_FROM_NAME:-}"
    volumes:
      # Both stores are needed, and a database alone is not a backup: the key
      # that makes stored tokens readable lives here.
      - logaffe-volume:/var/lib/logaffe
    ports:
      - "8080:8080"
    healthcheck:
      # Answers 200 or 503 and nothing else; it reports ready when the database
      # is reachable and migrations are complete.
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: logaffe
      POSTGRES_USER: logaffe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - logaffe-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logaffe -d logaffe"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  logaffe-volume:
  logaffe-db:
