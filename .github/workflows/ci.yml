name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So that a run can be started without inventing a commit to carry it.
  workflow_dispatch:

permissions:
  contents: read

# Every job below runs on a GitHub-hosted runner. This repository owned a pair
# of them for as long as it was private, where CI is metered against a monthly
# allowance; a public repository runs on standard hosted runners for nothing, so
# what owning them bought no longer exists.
#
# What it cost did. A hosted runner is a fresh virtual machine per job, thrown
# away afterwards — which is what makes `on: pull_request` safe to leave open to
# strangers, and what removes the arrangements a long-lived machine on a home
# network needed: no emptying `runner.temp` because state survives between runs,
# no per-fork `runs-on`, no runner version anybody has to keep above the floor
# the actions require.
#
# This is not faster, and was not adopted for speed. The critical path is
# `integration → image` and no number of runners shortens it; a cold Docker
# layer cache and cold NuGet and npm caches make it slightly slower, which
# `cache-from: type=gha` and the `actions/setup-*` caches only partly absorb.

# One run at a time, across every branch. The reason is no longer the runners —
# a fresh machine per job has no ports to fight over — it is the registry. The
# `image` job moves `ghcr.io/datavisionzero/logaffe:main`, and staging follows
# that tag (ADR 0038): two runs overlapping would leave it wherever the slower
# one finished, which can be the older commit. Serialising keeps the tag moving
# in the order the commits were pushed. Nothing is cancelled, so every run still
# happens, and with a single operator pushing there is nothing to gain from two
# racing.
concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  # Seconds, and no Docker. Domain rules and use cases against substituted
  # ports, and the collector against a directory of files that look like /proc.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore Logaffe.slnx
      - run: dotnet build Logaffe.slnx -c Release --no-restore
      - run: dotnet test tests/Logaffe.UnitTests -c Release --no-build

  # The parts no substitute can vouch for: the migrations, and what the schema
  # actually does on the Postgres an installation runs.
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore Logaffe.slnx
      - run: dotnet build Logaffe.slnx -c Release --no-restore

      - name: Integration tests
        run: dotnet test tests/Logaffe.IntegrationTests -c Release --no-build
        env:
          # Every test here that starts an installation gives it a host volume,
          # and logaffe writes its own account of itself there rather than into
          # itself (ADR 0002). Naming a directory keeps those volumes instead of
          # deleting them with the test, so that a failure on this runner can be
          # read from the installation's side as well as the caller's — which is
          # what #46 has no way of answering today. The directory starts empty
          # because the machine does: nothing survives from the run before.
          LOGAFFE_TEST_VOLUMES: ${{ runner.temp }}/installations

      - name: Keep what the installations wrote
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: installation-logs
          # The logs and nothing else. The same volumes hold the key that makes
          # a token readable (ADR 0022) — a test one, but an artifact is a thing
          # that gets downloaded, and a key does not belong in one.
          path: ${{ runner.temp }}/installations/**/logs/*.log
          if-no-files-found: warn
          retention-days: 14

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build -- --outDir dist --emptyOutDir

  # ADR 0001 accepts that the frontend shares no types with the backend and asks
  # for a contract kept honest by tests rather than by the compiler. This is that
  # test: the document the running installation serves has to be the one that is
  # checked in.
  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: logaffe
          POSTGRES_USER: logaffe
          POSTGRES_PASSWORD: logaffe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logaffe -d logaffe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Start the installation
        run: dotnet run --project src/Logaffe.Api -c Release --no-launch-profile &
        env:
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=logaffe;Username=logaffe;Password=logaffe
          Logaffe__VolumePath: ${{ runner.temp }}/volume
          ASPNETCORE_HTTP_PORTS: "5142"

      - name: Capture the contract
        run: |
          for _ in $(seq 1 45); do
            curl --fail --silent http://localhost:5142/openapi/v1.json -o /tmp/openapi.json && break
            sleep 2
          done
          test -s /tmp/openapi.json || { echo "the installation never served a document"; exit 1; }
          # Formatted by the json module rather than by json.tool, whose --indent
          # flag is not in every Python the runner might carry.
          python3 -c 'import json,pathlib; d=json.loads(pathlib.Path("/tmp/openapi.json").read_text()); pathlib.Path("docs/api/openapi.json").write_text(json.dumps(d, indent=2) + "\n")'

      - name: The checked-in contract is the one being served
        run: git diff --exit-code -- docs/api/openapi.json

  # The two images a staging installation follows — the installation's and the
  # collector's. `release.yml` publishes both for every tag; this publishes both
  # for every trunk commit that passed, which is the only thing an environment
  # tracking `main` can pull.
  image:
    name: Images
    # This is the whole of the deployment gate. A red trunk does not move
    # `:main`, so staging stays on the last commit that passed — and expressing
    # it here costs nothing beyond building an image nobody will pull, which is
    # cheaper than a second workflow or a `workflow_run` trigger.
    needs: [unit, integration, web, contract]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - id: what
        name: Whether this is published, and under which names
        env:
          # A pull request's ref is `refs/pull/<n>/merge` and never this, so the
          # one comparison covers it: a pull request builds and publishes
          # nothing, which is the behaviour this job already had and the reason
          # it exists.
          PUBLISH: ${{ github.ref == 'refs/heads/main' }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          {
            echo "publish=$PUBLISH"
            echo "tags<<TAGS"

            if [ "$PUBLISH" = "true" ]; then
              # What a staging installation pulls.
              echo "ghcr.io/datavisionzero/logaffe:main"
              # And a name for this one build, so a staging installation can be
              # pinned away from a bad trunk without waiting for the next commit.
              echo "ghcr.io/datavisionzero/logaffe:sha-${SHA:0:7}"
            fi

            echo "TAGS"

            # The collector is a second image on the same two names, built from
            # the same commit by the same job (ADR 0043). It is not a second job
            # because it is not a second gate: what decides whether either is
            # published is the tests above, and splitting them would mean a
            # trunk where the installation moved and the machines reporting to
            # it did not.
            echo "collector<<TAGS"

            if [ "$PUBLISH" = "true" ]; then
              echo "ghcr.io/datavisionzero/logaffe-collector:main"
              echo "ghcr.io/datavisionzero/logaffe-collector:sha-${SHA:0:7}"
            fi

            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Sign in to the registry
        if: steps.what.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No `VERSION` build argument, deliberately. `Directory.Build.props` keeps
      # `0.0.0-dev` for a build nobody released, and the number a release stamps
      # is load-bearing beyond the registry — a backup manifest records it
      # (ADR 0024). A trunk build is not a release and should not claim a number.
      #
      # `REVISION` is passed for the same reason `VERSION` is not. Staging
      # follows this tag and moves through many of these builds between releases
      # (ADR 0038), and every one of them calls itself `0.0.0-dev` — so the
      # commit is what tells them apart, and it says which build answered
      # without claiming a number nobody released. The container cannot work it
      # out on its own: `Dockerfile.dockerignore` excludes `.git/`, so there is
      # no repository in the build for the SDK to read a revision out of.
      #
      # `:latest` is not among the tags either. It is what
      # `deploy/docker-compose.yml` pulls and therefore what a stranger's
      # installation upgrades into; `release.yml` already refuses to move it for
      # a prerelease, and the trunk has less claim on it than a prerelease does.
      - name: Build, and push from the trunk
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ steps.what.outputs.publish == 'true' }}
          build-args: |
            REVISION=${{ github.sha }}
          tags: ${{ steps.what.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The collector, on the same terms. It carries no packages and one
      # project, so this is seconds rather than a second build worth arranging
      # around — and its own cache scope, because the two share no layer beyond
      # the SDK image.
      - name: Build the collector, and push from the trunk
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.collector
          push: ${{ steps.what.outputs.publish == 'true' }}
          build-args: |
            REVISION=${{ github.sha }}
          tags: ${{ steps.what.outputs.collector }}
          cache-from: type=gha,scope=collector
          cache-to: type=gha,mode=max,scope=collector
