# A tag is the release, and the tag is the version.
#
#   git tag v1.4.0 && git push origin v1.4.0
#
# One tag publishes the image and all three packages under the same number, and
# writes the release entry that names it. For a project this size a single
# version is far less to explain than two release trains, and a client package
# carrying the server's number says something useful about what it was built
# against. The accepted cost is that a package gets a version bump with nothing
# changed in it.
#
# That number is load-bearing beyond the registry: `logaffe backup` writes it
# into the manifest and a restore compares what it finds there, so one version
# has to mean one thing everywhere. It reaches the build as `-p:Version=`, taken
# from the tag and from nowhere else — `Directory.Build.props` otherwise says
# `0.0.0-dev`, which is what an unreleased build honestly is.

name: Release

on:
  push:
    tags: ["v*"]
  # So that a release can be re-run against a tag that already exists, which is
  # what a failed push to one registry leaves behind.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release, as it is written (v1.4.0).
        required: true

permissions:
  contents: read
  packages: write

# Never two releases at once, and never a release racing the CI run of the
# commit it is built from: both move tags in the registry, and which build
# landed last is what an installation pulls.
concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      ref: ${{ steps.read.outputs.ref }}
      latest: ${{ steps.read.outputs.latest }}
    steps:
      - id: read
        name: Read the version out of the tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          case "$TAG" in
            v*) version="${TAG#v}" ;;
            *) echo "A release tag begins with v: $TAG"; exit 1 ;;
          esac

          # What NuGet and the registry will both take, and what the build can
          # stamp: major.minor.patch, with an optional prerelease behind it.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Not a version this can release: $version"
            exit 1
          fi

          {
            echo "version=$version"
            echo "ref=$TAG"
            # `latest` is what `deploy/docker-compose.yml` pulls, so a
            # prerelease must not move it — an operator who never asked for one
            # would be upgraded into it by an ordinary `docker compose pull`.
            case "$version" in
              *-*) echo "latest=false" ;;
              *) echo "latest=true" ;;
            esac
          } >> "$GITHUB_OUTPUT"

          echo "Releasing logaffe $version from $TAG."

  image:
    name: Image
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to the registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        name: Which names this image answers to
        env:
          VERSION: ${{ needs.version.outputs.version }}
          LATEST: ${{ needs.version.outputs.latest }}
        run: |
          set -euo pipefail

          {
            echo "tags<<TAGS"
            echo "ghcr.io/datavisionzero/logaffe:$VERSION"

            if [ "$LATEST" = "true" ]; then
              echo "ghcr.io/datavisionzero/logaffe:latest"
            fi

            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      # Read off the checkout rather than from `github.sha`, which is the commit
      # that started the run: for the `workflow_dispatch` route that is the
      # default branch and not the tag being released. The checkout above is the
      # tag, so this is the commit the image is actually built from.
      - id: commit
        name: Which commit this image is
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            REVISION=${{ steps.commit.outputs.revision }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  packages:
    name: Packages
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing. This job asks the Actions service for an OIDC token
      # describing which repository and which workflow file is running, and
      # trades it at nuget.org for a key that lives an hour. Without this
      # permission the token is never issued and the login step below fails.
      #
      # `packages: write` is not inherited here on purpose: this job publishes
      # to nuget.org and has no business with the container registry.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The three of them and nothing else: every other project in the solution
      # says it is not packable.
      - name: Pack
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          for package in Logaffe.Client Logaffe.Serilog Logaffe.Extensions.Logging; do
            dotnet pack "src/clients/$package/$package.csproj" \
              -c Release \
              -p:Version="$VERSION" \
              -o packages
          done

      # There is no stored publishing credential. nuget.org holds a policy
      # naming this repository, this workflow file and this account, and hands
      # back a key valid for an hour to a run that matches it — so the thing an
      # attacker would want to steal from this repository does not exist, and
      # there is nothing to rotate on a calendar.
      #
      # The policy is bound to the file name `release.yml`. Renaming this file
      # breaks publishing until the policy is updated to match, which is worth
      # knowing before somebody tidies it into `publish.yml`.
      #
      # The account name is not secret, but this repository is public and there
      # is no reason to write it down here for a reader who has no use for it.
      - name: A key that expires in an hour
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # nuget.org rather than this repository's own package feed, because the
      # problem being solved is that these are unreachable to anyone who is not
      # building the repository — and a feed that has to be configured and
      # authenticated before `dotnet add package` works is not reachable in the
      # sense that matters.
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          # `--skip-duplicate`, so that re-running a release whose image
          # succeeded and whose packages half did is not an error. A re-run gets
          # a fresh key: the exchanged token is single-use and the key it bought
          # is an hour old at most, so there is no reusing one from last time.
          dotnet nuget push "packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

  entry:
    name: Entry
    needs: [version, image, packages]
    runs-on: ubuntu-latest
    permissions:
      # The one job here that writes to the repository rather than to a
      # registry, and it writes exactly one thing: the release the tag names.
      # `packages: write` is not inherited, for the same reason it is not
      # inherited by the job above — this one has no business with either
      # registry.
      contents: write
    steps:
      # The tag is the release everywhere else in this file. This is the one
      # place it is also a page, and without it a released version sits on the
      # registry and on nuget.org and nowhere a reader looks first: GitHub goes
      # on showing the release before it as "Latest", so the page built for
      # telling an operator which version to take tells them the wrong one.
      #
      # It runs behind both publishing jobs on purpose. An entry announcing an
      # image that failed to push is worse than no entry at all.
      - name: Write the release the tag names
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.ref }}
          LATEST: ${{ needs.version.outputs.latest }}
        run: |
          set -euo pipefail

          # Never over an entry that is already there. Re-running a release
          # against an existing tag is the recovery path this workflow is built
          # for, and by then the entry may carry notes somebody wrote by hand.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "$TAG already has a release entry, which is left as it is."
            exit 0
          fi

          # `latest` is decided once, up in the version job, and means the same
          # thing here as it does for the image: a prerelease moves neither the
          # tag an ordinary `docker compose pull` follows nor the entry an
          # operator lands on.
          if [ "$LATEST" = "true" ]; then
            marker=--latest
          else
            marker=--prerelease
          fi

          # The notes are generated from what is between this tag and the one
          # before it, and they are a starting draft rather than the release
          # notes: what changed for the operator, and whether they have to
          # decide anything before pulling, is prose no workflow can write. What
          # it can do is make sure the page exists and names the right version
          # the minute the artifacts do — an entry written by hand three days
          # later is three days of the wrong number.
          gh release create "$TAG" \
            --repo "$REPO" \
            --verify-tag \
            --generate-notes \
            "$marker"
